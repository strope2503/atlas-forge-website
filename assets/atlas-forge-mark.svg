      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cad5e3"/>
      <stop offset="1" stop-color="#6f7d91"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
