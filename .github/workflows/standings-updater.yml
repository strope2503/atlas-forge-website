name: Hourly Standings Updater

on:
  schedule:
    - cron: '0 * * * *' # Runs at minute 0 of every hour
  workflow_dispatch: # Allows you to manually trigger it from GitHub

jobs:
  update-standings:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Run Standings Scraper
        run: node houston-dutch-lions/update_standings.js
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add houston-dutch-lions/index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update standings from GotSport" && git push)
