<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operator Deck</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1118;
            --panel-bg: rgba(18, 25, 36, 0.7);
            --text-main: #ffffff;
            --text-muted: #8d98aa;
            --accent-cyan: #00f0ff;
            --accent-red: #ff4757;
            --accent-green: #37ff6c;
            --font: "Inter", sans-serif;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: var(--font); }

        body {
            margin: 0;
            background: var(--bg) url('assets/cameraman_bg.jpg') center/cover no-repeat;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* Top Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(11, 17, 24, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        .brand {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-red);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .brand-icon {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-red);
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-icon::after {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
        }
        
        .live-status {
            background: rgba(255, 71, 87, 0.15);
            color: var(--accent-red);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 71, 87, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .live-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .header-center {
            display: flex;
            gap: 24px;
        }
        
        .nav-item {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Main Workspace */
        .workspace {
            flex: 1;
            position: relative;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        
        .side-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 280px;
            pointer-events: auto;
        }
        
        /* Glass Panels */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            margin: 0;
        }
        .dots {
            letter-spacing: 2px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Camera Controls */
        .cam-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .control-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .control-btn.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.1);
        }
        .control-icon {
            font-size: 16px;
        }
        
        /* Focus/Zoom Sliders */
        .slider-wrap {
            margin-bottom: 16px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
        .slider-label span { color: var(--text-main); }
        .slider-track {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            position: relative;
        }
        .slider-fill {
            height: 100%;
            background: var(--accent-cyan);
            border-radius: 2px;
            position: absolute;
            left: 0; top: 0;
        }
        .slider-thumb {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: -4px;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(0,240,255,0.5);
        }

        /* Stream Stats */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        /* Action Buttons Right Column */
        .big-action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-transform: uppercase;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .big-action-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .big-action-btn.danger {
            border-color: rgba(255, 71, 87, 0.5);
            color: var(--accent-red);
        }
        .big-action-btn.danger:hover {
            background: rgba(255, 71, 87, 0.1);
        }

        /* Viewfinder Center */
        .center-hud {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 300px;
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
        }
        .center-hud::before, .center-hud::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.5);
        }
        .center-hud::before { width: 20px; height: 1px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .center-hud::after { width: 1px; height: 20px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        .corner { position: absolute; width: 20px; height: 20px; border: 2px solid var(--accent-cyan); }
        .c-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .c-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .c-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .c-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .recording-indicator {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
        .rec-dot {
            width: 10px; height: 10px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            Operator Deck
        </div>
        
        <div class="header-center">
            <div class="nav-item active">Cam 1</div>
            <div class="nav-item">Cam 2</div>
            <div class="nav-item">Drone</div>
            <div class="nav-item">Tactical</div>
        </div>
        
        <div class="header-actions">
            <div class="live-status">Live</div>
            <div class="icon-btn">⚙</div>
        </div>
    </header>

    <div class="workspace">
        
        <!-- Left Column -->
        <div class="side-col">
            <!-- Camera Mode -->
            <div class="glass-panel">
                <div class="panel-header">
                    <h3 class="panel-title">Tracking Mode</h3>
                </div>
                <div class="cam-controls">
                    <div class="control-btn active">
                        <span class="control-icon">🎯</span>
                        Auto
                    </div>
                    <div class="control-btn">
                        <span class="control-icon">👋</span>
                        Manual
                    </div>
                    <div class="control-btn">
                        <span class="control-icon">🏃</span>
                        Follow
                    </div>
                    <div class="control-btn">
                        <span class="control-icon">⚽</span>
                        Ball
                    </div>
                </div>
            </div>

            <!-- Lens Control -->
            <div class="glass-panel">
                <div class="panel-header">
                    <h3 class="panel-title">Lens Control</h3>
                </div>
                
                <div class="slider-wrap">
                    <div class="slider-label">Zoom <span>2.4x</span></div>
                    <div class="slider-track">
                        <div class="slider-fill" style="width: 40%;"></div>
                        <div class="slider-thumb" style="left: 40%;"></div>
                    </div>
                </div>
                
                <div class="slider-wrap">
                    <div class="slider-label">Focus <span>Auto</span></div>
                    <div class="slider-track">
                        <div class="slider-fill" style="width: 75%; background: var(--text-muted);"></div>
                        <div class="slider-thumb" style="left: 75%;"></div>
                    </div>
                </div>
                
                <div class="slider-wrap" style="margin-bottom:0;">
                    <div class="slider-label">Iris <span>f/4.0</span></div>
                    <div class="slider-track">
                        <div class="slider-fill" style="width: 60%; background: var(--text-muted);"></div>
                        <div class="slider-thumb" style="left: 60%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Center Viewfinder HUD -->
        <div class="recording-indicator">
            <div class="rec-dot"></div>
            REC 01:24:15
        </div>
        
        <div class="center-hud">
            <div class="corner c-tl"></div>
            <div class="corner c-tr"></div>
            <div class="corner c-bl"></div>
            <div class="corner c-br"></div>
        </div>

        <!-- Right Column -->
        <div class="side-col">
            <!-- Stream Stats -->
            <div class="glass-panel">
                <div class="panel-header">
                    <h3 class="panel-title">Stream Status</h3>
                </div>
                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="stat-label">Bitrate</div>
                        <div class="stat-value">8.5 <span style="font-size:12px; color:var(--text-muted);">Mbps</span></div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">FPS</div>
                        <div class="stat-value">59.94</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Resolution</div>
                        <div class="stat-value" style="font-size:16px;">1080p</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Network</div>
                        <div class="stat-value" style="color:var(--accent-green);">Excellent</div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="glass-panel" style="flex:1;">
                <div class="panel-header">
                    <h3 class="panel-title">Actions</h3>
                </div>
                
                <div class="big-action-btn">
                    Mark Highlight <span>★</span>
                </div>
                
                <div class="big-action-btn">
                    Capture Still <span>📷</span>
                </div>
                
                <div class="big-action-btn danger" style="margin-top: 40px;">
                    Stop Stream <span>⏹</span>
                </div>
                
            </div>
        </div>
        
    </div>

</body>
</html>
