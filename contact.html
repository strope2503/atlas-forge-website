<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Sales | Atlas Forge</title>
    <style>
        :root {
            --bg-obsidian: #000000;
            --bg-panel: rgba(22, 27, 34, 0.6);
            --border-dark: rgba(255, 255, 255, 0.1);
            --accent-cyan: #00F2FE;
            --accent-blue: #4FACFE;
            --text-main: #F0F6FC;
            --text-muted: #8B949E;
            --glass-blur: blur(12px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Header */
        .atlas-header {
            height: 70px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-dark);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-link { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-logo { height: 40px; object-fit: contain; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-item {
            color: var(--text-muted); text-decoration: none; font-weight: 600;
            font-size: 0.9rem; transition: color 0.3s ease; display: flex; align-items: center; gap: 8px;
        }
        .nav-item img { height: 20px; }
        .nav-item:hover, .nav-item.active { color: var(--text-main); }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 24px;
            flex: 1;
        }

        .glass-panel {
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-dark);
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 { font-size: 3rem; font-weight: 800; margin-bottom: 10px; color: var(--accent-cyan); text-align: center; }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 1.2rem; margin-bottom: 40px; }

        /* Form Styles */
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #ccc; }
        
        input, select, textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.05);
        }

        select option { background: #161B22; color: #fff; }

        button[type="submit"] {
            width: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,242,254,0.3);
        }
    </style>
</head>
<body>

    <header class="atlas-header">
        <div class="nav-container">
            <a href="index_v2.html" class="brand-link">
                <img src="ATLAS_FORGE_LOGO.png" alt="Atlas Forge Logo" class="brand-logo">
            </a>
            <nav class="nav-links">
                <a href="index_v2.html" class="nav-item">Home</a>
                <a href="scout_pro_v2.html" class="nav-item">
                    <img src="ATLAS_SCOUT_LOGO.png" alt="Scout Logo"> Scout Pro V8.0
                </a>
                <a href="forge_ledger_v2.html" class="nav-item">
                    <img src="ATLAS_LEDGER_LOGO.png" alt="Ledger Logo"> The Forge Ledger™
                </a>
                <a href="contact_v2.html" class="nav-item active">Contact</a>
            </nav>
        </div>
    </header>

    <div class="container reveal">
        <div class="glass-panel">
            <h1>Let's Build Together.</h1>
            <p class="subtitle">Reach out to our sales and engineering team to get started.</p>
            
            <!-- Using formsubmit.co to securely route emails without backend code -->
            <form action="https://formsubmit.co/sales@atlasforgetech.com" method="POST">
                <!-- Disable Captcha and set next page -->
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="New Inquiry from Atlas Forge Website">
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                </div>
                
                <div class="form-group">
                    <label for="organization">Organization / Club Name</label>
                    <input type="text" id="organization" name="organization" placeholder="FC Barcelona (Optional)">
                </div>
                
                <div class="form-group">
                    <label for="interest">Primary Interest</label>
                    <select id="interest" name="interest" required>
                        <option value="Atlas Scout Pro V8.0 Hardware">Atlas Scout Pro V8.0 Hardware</option>
                        <option value="The Forge Ledger Financial OS">The Forge Ledger Financial OS</option>
                        <option value="Custom Software Development">Custom Software Development</option>
                        <option value="General Inquiry / Support">General Inquiry / Support</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Tell us about your needs..."></textarea>
                </div>
                
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

</body>
</html>
